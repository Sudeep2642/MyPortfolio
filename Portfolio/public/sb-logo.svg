  <!-- Accent dot -->
  <circle cx="79" cy="70" r="3" fill="#7c6fff"/>

  <!-- Corner circuit marks -->
  <path d="M 8 18 L 8 10 L 16 10" fill="none" stroke="#00c8ff" stroke-width="1.2" opacity="0.55"/>
  <path d="M 92 18 L 92 10 L 84 10" fill="none" stroke="#00c8ff" stroke-width="1.2" opacity="0.55"/>
  <path d="M 8 82 L 8 90 L 16 90" fill="none" stroke="#00c8ff" stroke-width="1.2" opacity="0.55"/>
  <path d="M 92 82 L 92 90 L 84 90" fill="none" stroke="#00c8ff" stroke-width="1.2" opacity="0.55"/>
</svg>

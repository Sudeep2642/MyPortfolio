  <path d="M 44.5 34 L 27 34"
    fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linecap="round"/>

  <!-- B glyph -->
  <path d="M 50 34 L 50 70" fill="none" stroke="url(#g)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 50 34 L 64 34 C 71 34 74 38 74 43 C 74 48 71 52 64 52 L 50 52"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0618"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#aa42ff"/>
    </linearGradient>
  </defs>

  <!-- Background square with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#c2a4ff" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- S letterform -->
  <text
    x="10"
    y="43"
    font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif"
    font-size="36"
    font-weight="700"
    fill="url(#accent)"
    letter-spacing="-1"
  >SB</text>

  <!-- Dot accent bottom-right -->
  <circle cx="55" cy="52" r="3" fill="#c2a4ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
